; inkwake firmware -- M5Stack PaperColor (C151)
;
; There is no PaperColor board definition in either platform-espressif32 fork
; (HARDWARE.md 7.2), so we drive a generic S3 board and pin every setting the
; real hardware needs by hand. Each one below is load-bearing; none is style.

[env:papercolor]
; Pinned to the platform release this firmware was first run on real hardware
; with. 7.1.3 builds too and carries the same Arduino core (2.0.17, dcc1105b),
; but an unpinned platform means CI and a contributor can build different
; images from the same commit.
platform  = espressif32 @ 7.0.1
board     = esp32s3box            ; M5Stack's own docs recommend this stand-in
framework = arduino

; OPI PSRAM is non-negotiable. M5GFX refuses to drive this panel without it and
; fails *silently* -- the board still autodetects, M5.Display just does nothing.
; This is the #1 blank-screen cause (HARDWARE.md 10.1).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = dio
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    ; Skip autodetect -- and this is a safety measure, not a speed one.
    ; M5GFX consults this hint whenever its NVS key is unset
    ; (M5GFX.cpp:1064-1067), and with the hint set that key is never written:
    ; autodetect returns the same value it was seeded with, so the
    ; `nvs_board != board` store at M5GFX.cpp:1124 never fires. The hint is
    ; therefore load-bearing on EVERY boot, not just the first -- removing it
    ; later would restore the full probe below on every wake.
    ; Without it, autodetect walks every S3 board ahead of PaperColor in the
    ; list, and those probes drive *our* pins: the CoreS3 branch bitbangs I2C
    ; on G11/G12 (EINK_BUSY and EINK_RST, panel rail still down), the Dial
    ; branch drives G7 push-pull as a chip select (G7 is RTC_IRQ and sits on
    ; the PMIC as PYG2, i.e. on the wake path), and the StopWatch branch
    ; bitbangs G47/G48. The hint cannot lock the board out: the PaperColor
    ; branch still verifies for itself (M5GFX.cpp:2211-2226), and a failed
    ; check falls back to board_unknown and a full probe.
    ;
    ; Written symbolically rather than as 28 so that a rename in a future
    ; ^0.2.x fails at the compiler instead of silently selecting a neighbour.
    -DM5GFX_BOARD=board_t::board_M5PaperColor
    ; Where a factory-fresh board looks first. After setup the value in NVS
    ; wins, so this is the fallback rather than the setting -- but it has to be
    ; a real address, because it is what the very first wake uses.
    ;
    ; This define OVERRIDES the default in config.h, which is why both carry the
    ; same string and why changing one alone is a trap: the header would read
    ; correctly and the built image would still point somewhere else. It was one
    ; for exactly as long as it took to grep the binary.
    ;
    ; A placeholder on purpose: the real address is entered in the setup portal
    ; and kept in NVS, so a fresh board built from this file talks to nobody
    ; until it is configured. Put your own server here if you would rather not
    ; type it on a phone. A path is allowed -- serverBase() keeps it and appends
    ; API_DISPLAY_PATH, so https://example.com/eink resolves to
    ; https://example.com/eink/api/display behind a path-prefix proxy.
    -DEINK_SERVER_URL='"https://eink.example.com"'
    ; Mandatory companion to an https:// URL. Without it clientFor() falls back
    ; to setInsecure() and the board accepts any certificate on the open
    ; internet -- it says so in the log, and nobody reads the log of a device
    ; that is working. Costs ~62 kB of flash out of 6.5 MB.
    -DEINK_TLS_CA_BUNDLE

; Only our own sources. The M5 libraries are noisy under -Wextra and we are not
; going to fix them.
build_src_flags =
    -Wall
    -Wextra

lib_deps =
    ; M5Unified >= 0.2.14 is where PaperColor support landed, M5GFX >= 0.2.20
    ; (HARDWARE.md 10.22). Pinning the minor is deliberate: a board this new
    ; gets its detection logic changed under you.
    m5stack/M5Unified @ ^0.2.20
    m5stack/M5GFX @ ^0.2.27
    ; M5Unified's power class does not expose the PMIC wake timer (6.1), and the
    ; wake timer is the whole low-power design. Hence the standalone library.
    m5stack/M5PM1 @ ^1.0.6
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.2.0
