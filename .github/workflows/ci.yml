name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      # Twice on purpose: pytest-randomly shuffles the order, and a single
      # green run has hidden a state leak between tests before.
      - run: python -m pytest -q
      - run: python -m pytest -q

  firmware:
    name: firmware (platformio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.2.0 -r requirements-dev.txt
      - run: pio run -e papercolor
        working-directory: firmware
      # With the M5 libraries fetched, the one test that skips everywhere else
      # can run: it checks the server's palette against what M5GFX quantises to.
      - run: python -m pytest -q -p no:randomly tests/test_deploy.py -k m5gfx
        env:
          INKWAKE_REQUIRE_M5GFX: '1'
      - run: python firmware/tools/verify-image.py firmware/.pio/build/papercolor/firmware.bin

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Compose file is valid
        env:
          PUBLIC_BASE_URL: https://eink.example.com
        run: docker compose config --quiet
      - name: Build and start the image, then probe it
        env:
          PUBLIC_BASE_URL: https://eink.example.com
          WARM_ON_START: 'false'
        run: |
          docker compose up -d --build
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8099/healthz
          docker compose exec -T inkwake python -m app.cli device add --label ci > /dev/null
          docker compose exec -T inkwake python -m app.cli device list
          curl -fsS -o frame.png http://127.0.0.1:8099/preview
          file frame.png | grep -q 'PNG image data, 400 x 600'
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()

  secrets:
    # Full-history secret scan on every PR and push. Same tool and version as
    # the pre-commit hook (.pre-commit-config.yaml).
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the full history
        run: ./gitleaks git . --redact --no-banner
